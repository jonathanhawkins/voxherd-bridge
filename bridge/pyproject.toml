[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxherd-bridge"
version = "1.0.0"
description = "Voice-first multi-instance Claude Code controller - bridge server"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "websockets>=12.0,<13.0",
    "rich>=13.7,<14.0",
    "httpx>=0.27,<1.0",
    "zeroconf>=0.131,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "httpx>=0.27",
]

[project.scripts]
voxherd = "bridge.cli:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pyinstaller: exercises the compiled macos/dist binary rather than the source",
]
# The PyInstaller tests assert a property of a *build*, not of the source in
# front of you. Against a stale macos/dist they fail, and the failure is then
# about the artefact, not the change under test. Deselected by default; a
# command-line `-m` overrides this, so `-m pyinstaller` runs exactly them
# after a build. (They used to *hang* against one rather than fail -- the
# readline behind the helpers' timeout blocked until the bridge next logged,
# which cost ~2.5 h a run. Bounded now; see ``_PipeReader``.)
addopts = "-m 'not pyinstaller'"

[tool.ruff]
line-length = 100
target-version = "py311"
